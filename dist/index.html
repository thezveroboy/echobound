<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echobound — Open-World Action-RPG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; }
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0a0a12; color: #e8d5c4; font-size: 1.2rem;
      transition: opacity 1s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .bar {
      width: 240px; height: 3px; background: #1a1a2e; border-radius: 2px; margin-top: 16px; overflow: hidden;
    }
    #loading .bar-fill {
      width: 0%; height: 100%; background: linear-gradient(90deg, #e8a87c, #d4a5e8);
      transition: width 0.3s;
    }
    #loading .title {
      font-size: 1.8rem; font-weight: 300; letter-spacing: 0.3em; margin-bottom: 8px;
      background: linear-gradient(135deg, #e8a87c, #d4a5e8, #7cc8e8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #ui-overlay {
      position: fixed; inset: 0; z-index: 100; pointer-events: none;
    }
    #ui-overlay > * { pointer-events: auto; }
    #hud {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 40px; align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .hud-stat {
      display: flex; align-items: center; gap: 10px;
      color: #e8d5c4; font-size: 0.85rem; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .hud-stat .icon { font-size: 1.2rem; }
    .hud-stat .bar-bg {
      width: 120px; height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden;
      backdrop-filter: blur(4px);
    }
    .hud-stat .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .hud-stat .bar-fill.hp { background: linear-gradient(90deg, #e86a6a, #ff8a8a); }
    .hud-stat .bar-fill.stamina { background: linear-gradient(90deg, #6ae8a8, #8affc8); }
    #weapon-hud {
      position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    .weapon-slot {
      width: 52px; height: 52px; border: 2px solid rgba(232,213,196,0.3);
      border-radius: 8px; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    .weapon-slot.active { border-color: #e8a87c; box-shadow: 0 0 12px rgba(232,168,124,0.4); }
    .weapon-slot .key { position: absolute; top: -18px; font-size: 0.65rem; color: rgba(232,213,196,0.5); }
    .weapon-slot .weapon-level { position: absolute; bottom: 1px; right: 3px; font-size: 0.6rem; color: #ffdd88; text-shadow: 0 0 4px rgba(255,221,136,0.5); }
    #controls-hint {
      position: absolute; bottom: 100px; left: 30px;
      color: rgba(232,213,196,0.4); font-size: 0.7rem; line-height: 1.6;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    #damage-numbers {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
    }
    .dmg-num {
      position: absolute; font-size: 1.4rem; font-weight: 700;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      animation: dmgFloat 0.8s ease-out forwards;
      pointer-events: none;
    }
    @keyframes dmgFloat {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }
    #boss-hp {
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      display: none; flex-direction: column; align-items: center; gap: 6px;
    }
    #boss-hp .name { color: #ff6a6a; font-size: 0.9rem; letter-spacing: 0.2em; text-shadow: 0 0 20px rgba(255,0,0,0.4); }
    #boss-hp .bar-bg { width: 300px; height: 8px; background: rgba(0,0,0,0.6); border-radius: 4px; overflow: hidden; }
    #boss-hp .bar-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ff8888); border-radius: 4px; transition: width 0.3s; }
    #minimap {
      position: absolute; top: 20px; right: 20px;
      width: 120px; height: 120px; border-radius: 50%;
      border: 2px solid rgba(232,213,196,0.2);
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      overflow: hidden;
    }
    #minimap canvas { width: 100%; height: 100%; border-radius: 50%; }
    #interact-hint {
      position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%);
      color: #e8d5c4; font-size: 0.8rem; background: rgba(0,0,0,0.5);
      padding: 8px 16px; border-radius: 6px; backdrop-filter: blur(4px);
      opacity: 0; transition: opacity 0.3s;
    }
    #interact-hint.show { opacity: 1; }
    #inventory-btn {
      position: absolute; top: 20px; left: 20px;
      width: 40px; height: 40px; border: 1px solid rgba(232,213,196,0.2);
      border-radius: 8px; background: rgba(0,0,0,0.3); color: #e8d5c4;
      font-size: 1rem; cursor: pointer; transition: all 0.2s;
    }
    #inventory-btn:hover { border-color: #e8a87c; background: rgba(232,168,124,0.1); }
    #inventory-panel {
      position: absolute; top: 70px; left: 20px;
      width: 280px; background: rgba(10,10,18,0.85);
      border: 1px solid rgba(232,213,196,0.15);
      border-radius: 12px; padding: 16px;
      backdrop-filter: blur(12px);
      display: none;
    }
    #inventory-panel.open { display: block; }
    #inventory-panel h3 { color: #e8d5c4; font-size: 0.8rem; letter-spacing: 0.15em; margin-bottom: 12px; font-weight: 400; }
    #inventory-panel .section { margin-bottom: 16px; }
    #inventory-panel .section:last-child { margin-bottom: 0; }
    #inventory-panel .section-title { color: rgba(232,213,196,0.4); font-size: 0.65rem; letter-spacing: 0.15em; margin-bottom: 8px; text-transform: uppercase; }
    .inv-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(232,213,196,0.06); }
    .inv-row .label { color: rgba(232,213,196,0.5); font-size: 0.7rem; }
    .inv-row .value { color: #e8d5c4; font-size: 0.75rem; }
    #inv-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px;
    }
    .inv-slot {
      aspect-ratio: 1; background: rgba(232,213,196,0.06); border: 1px solid rgba(232,213,196,0.1);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; color: #e8d5c4; cursor: grab; transition: all 0.15s; position: relative;
      min-height: 40px;
    }
    .inv-slot:hover { border-color: rgba(232,168,124,0.4); background: rgba(232,168,124,0.08); }
    .inv-slot.has-item { border-color: rgba(232,168,124,0.3); }
    .inv-slot.drag-over { border-color: #e8a87c; background: rgba(232,168,124,0.15); }
    .inv-slot .qty { position: absolute; bottom: 1px; right: 3px; font-size: 0.55rem; color: rgba(232,213,196,0.5); }
    #inv-tools { display: flex; gap: 6px; margin-top: 8px; }
    #inv-tools button {
      flex: 1; padding: 4px; font-size: 0.65rem; background: rgba(232,213,196,0.06);
      border: 1px solid rgba(232,213,196,0.1); border-radius: 4px; color: #e8d5c4; cursor: pointer;
    }
    #inv-tools button:hover { background: rgba(232,168,124,0.1); border-color: rgba(232,168,124,0.3); }
    #inv-slot.dragging { opacity: 0.4; }
    #drag-ghost {
      position: fixed; pointer-events: none; z-index: 1000;
      font-size: 1.2rem; transform: translate(-50%, -50%);
      display: none;
    }
    #equip-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-bottom: 12px;
    }
    .equip-slot {
      background: rgba(232,213,196,0.08); border: 1px solid rgba(232,213,196,0.15);
      border-radius: 6px; padding: 6px 8px; display: flex; align-items: center; gap: 6px;
      cursor: grab; min-height: 32px; transition: all 0.15s; position: relative;
    }
    .equip-slot:hover { border-color: rgba(232,168,124,0.4); background: rgba(232,168,124,0.08); }
    .equip-slot.drag-over { border-color: #e8a87c; background: rgba(232,168,124,0.15); }
    .equip-slot .equip-label { color: rgba(232,213,196,0.4); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .equip-slot .equip-icon { color: #e8d5c4; font-size: 0.75rem; margin-left: auto; }
    .equip-slot.has-item .equip-label { color: rgba(232,213,196,0.7); }
  </style>
  <script type="module" crossorigin src="/assets/index-BBNa5qoz.js"></script>
</head>
<body>
  <div id="loading">
    <div class="title">✦ ECHOBOUND</div>
    <div style="color: rgba(232,213,196,0.6); font-size: 0.8rem; letter-spacing: 0.15em;">Open-World Action-RPG</div>
    <div class="bar"><div class="bar-fill" id="load-bar"></div></div>
  </div>

  <div id="ui-overlay">
    <div id="hud">
      <div class="hud-stat">
        <span class="icon">❤</span>
        <div class="bar-bg"><div class="bar-fill hp" id="hp-bar" style="width:100%"></div></div>
        <span id="hp-text">100</span>
      </div>
      <div class="hud-stat">
        <span class="icon">⚡</span>
        <div class="bar-bg"><div class="bar-fill stamina" id="stamina-bar" style="width:100%"></div></div>
        <span id="stamina-text">100</span>
      </div>
      <div class="hud-stat">
        <span class="icon">🪙</span>
        <span id="coin-text" style="font-size:0.85rem;color:#e8d5c4;text-shadow:0 1px 4px rgba(0,0,0,0.8)">0</span>
      </div>
    </div>
    <div id="weapon-hud"></div>
    <div id="controls-hint">WASD — Move<br>RMB+Drag — Orbit/Tilt Camera<br>LMB — Attack<br>1-5 — Weapon<br>E — Interact<br>I — Inventory</div>
    <div id="damage-numbers"></div>
    <div id="boss-hp">
      <span class="name">✦ NIGHTMARE TITAN</span>
      <div class="bar-bg"><div class="bar-fill" id="boss-bar"></div></div>
    </div>
    <div id="minimap"><canvas id="minimap-canvas" width="120" height="120"></canvas></div>
    <div id="interact-hint">Press E to interact</div>
    <button id="inventory-btn">🎒</button>
    <div id="inventory-panel">
      <div class="section">
        <h3>✦ EQUIPMENT</h3>
        <div id="equip-grid">
          <div class="equip-slot" data-equip="headwear"><span class="equip-label">Hair</span><span class="equip-icon" id="equip-headwear"></span></div>
          <div class="equip-slot" data-equip="dress"><span class="equip-label">Body</span><span class="equip-icon" id="equip-dress"></span></div>
          <div class="equip-slot" data-equip="legwear"><span class="equip-label">Legs</span><span class="equip-icon" id="equip-legwear"></span></div>
          <div class="equip-slot" data-equip="armwear"><span class="equip-label">Arms</span><span class="equip-icon" id="equip-armwear"></span></div>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Inventory</div>
        <div id="inv-grid"></div>
        <div id="inv-tools">
          <button id="inv-sort-btn">Sort</button>
          <button id="inv-drop-btn">Drop</button>
        </div>
      </div>
    </div>
    <div id="drag-ghost"></div>
  </div>

</body>
</html>
